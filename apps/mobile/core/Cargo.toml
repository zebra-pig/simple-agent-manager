[package]
name = "sam-core"
version = "0.1.0"
edition = "2021"
description = "Everything in the SAM native app that isn't UI (sign-in, session, API client, view models), exported to Swift and Kotlin via UniFFI."
publish = false

[lib]
name = "sam_core"
# cdylib: Android .so + host lib bindgen reads; staticlib: iOS XCFramework; lib: the bindgen bin + tests.
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "=0.29.4", features = ["cli", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# rustls, not native-tls: cross-compiles to the Apple and NDK triples without OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
